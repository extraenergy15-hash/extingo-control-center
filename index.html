<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extingo - Enter Passcode</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .gate-card {
            background: #1e1e1e;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            padding: 40px 36px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .gate-card h1 {
            margin: 0 0 6px 0;
            font-size: 24px;
            color: #ff9800;
        }

        .gate-card p.subtitle {
            margin: 0 0 28px 0;
            color: #aaaaaa;
            font-size: 14px;
        }

        form { display: flex; flex-direction: column; gap: 14px; }

        label {
            text-align: left;
            font-size: 13px;
            color: #bbbbbb;
        }

        input[type="password"] {
            background: #222222;
            color: #ffffff;
            border: 1px solid #555555;
            padding: 12px 14px;
            border-radius: 5px;
            font-size: 16px;
            letter-spacing: 2px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus {
            border-color: #00e676;
        }

        input[type="password"].input-error {
            border-color: #ff5252;
        }

        button {
            background: #333333;
            color: #ffffff;
            border: 1px solid #555555;
            padding: 12px 15px;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #444444; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-message {
            min-height: 18px;
            font-size: 13px;
            color: #ff5252;
            visibility: hidden;
        }

        .error-message.visible { visibility: visible; }

        /* Shake animation for wrong passcode */
        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @media (prefers-reduced-motion: reduce) {
            .shake { animation: none; }
        }
    </style>
</head>
<body>
    <div class="gate-card" id="gate-card">
        <h1>🔥 Extingo</h1>
        <p class="subtitle">Enter the passcode to continue</p>

        <form id="passcode-form" autocomplete="off">
            <label for="passcode">Passcode</label>
            <input
                type="password"
                id="passcode"
                name="passcode"
                inputmode="numeric"
                autocomplete="off"
                autofocus
                required
            >
            <div id="error-message" class="error-message" role="alert" aria-live="polite">
                Incorrect passcode. Try again.
            </div>
            <button type="submit" id="submit-btn">Unlock</button>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
